<main>
  <h1>Gestión de usuarios</h1>

  @if (loading()) {
    <p>Cargando...</p>
  } @else if (error()) {
    <p>{{ error() }}</p>
  } @else {
    <ul>
      @for (user of users(); track user.id) {
        <li>{{ user.name }} - {{ user.email }} - {{ user.address.city }}</li>
      }
    </ul>
  }
</main>
