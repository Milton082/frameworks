<main>
  <h1>Gestión de usuarios</h1>
  <p>Favoritos: {{ favoriteIds().length }}</p>

  @if (loading()) {
    <p>Cargando...</p>
  } @else if (error()) {
    <p>{{ error() }}</p>
  } @else {
    <section class="user-list">
      @for (user of users(); track user.id) {
        <app-user-card
          [user]="user"
          [isFavorite]="favoriteIds().includes(user.id)"
          (toggleFavorite)="toggleFavorite($event)"
        />
      }
    </section>
  }
</main>
